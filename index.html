<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Mufrodat</title>
<style>body{font-family:system-ui;padding:24px;background:#F4EFE4;color:#1A1916;margin:0}</style>
</head>
<body>
<p id="s">App laden…</p>
<script>
async function main(){
  const res = await fetch('app.b64');
  if(!res.ok) throw new Error('fetch '+res.status);
  const b64 = (await res.text()).trim();
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open(); document.write(html); document.close();
}
main().catch(e=>{document.getElementById('s').textContent='Fout: '+e; console.error(e);});
</script>
</body>
</html>
